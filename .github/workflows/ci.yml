# The four gates, on every push and pull request.
#
# No secrets are used here on purpose. A fork's pull request must be able to run the
# full suite, and on a public repository anything that needs a credential is also
# something an untrusted PR must not be able to reach.
#
# The storage contract runs against BOTH implementations. The Postgres half needs a
# database, not a credential: a service container is created for the job and thrown
# away with it, so a fork's pull request can run it exactly like anyone else.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run obsolete. Cancelling keeps the queue honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Postgres half of the storage contract.
  #
  # WHY THIS JOB EXISTS
  # `pnpm test` skips it unless ORBITWATCH_TEST_DATABASE_URL is set, and that variable
  # is deliberately separate from DATABASE_URL because the suite TRUNCATES every table
  # before each test. Without a job like this the skip is permanent, and every Postgres
  # query in the repository is shipped having only ever been type-checked -- the
  # in-memory implementation cannot catch a bad column name or a broken migration.
  #
  # A service container rather than a hosted database: no secret, so a fork's pull
  # request runs it too, and nothing it destroys was ever going to be missed.
  postgres:
    name: Storage contract (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: orbitwatch_contract
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Storage contract
        env:
          ORBITWATCH_TEST_DATABASE_URL: postgres://postgres:contract@127.0.0.1:5432/orbitwatch_contract
          # A container on the runner's own loopback offers no TLS, and there is nothing
          # crossing a network to protect. Every hosted deployment leaves this on.
          DATABASE_SSL: "false"
        run: pnpm --filter @orbitwatch/database exec vitest run src/contract-postgres.test.ts

  # Sharded across four runners, because the whole suite takes ~37 minutes on one.
  #
  # That is not slowness to be optimised away: these tests drive a real Cesium globe in
  # headless Chromium, which has no GPU and rasterises every frame on the CPU through
  # SwiftShader. The cost buys the only coverage that catches a renderer that builds
  # cleanly and then hangs, so the answer is more runners rather than fewer tests.
  #
  # Sharding is by file (the suite is not fullyParallel), and the slowest single file is
  # ~10 minutes, so no shard can finish much faster than that however many are added.
  browser:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One shard failing must not cancel the others: a green-except-for-one run is far
      # more useful to read than a run that stopped halfway through.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @orbitwatch/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # The globe is the one part that cannot be trusted to a type checker: the
      # Turbopack/Cesium failure in M0 built cleanly and then hung at runtime with no
      # stack trace. It was only ever caught by loading the page in a real browser.
      - name: Browser tests
        run: pnpm --filter @orbitwatch/web exec playwright test --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Unique per shard, or the four uploads collide and only one survives.
          name: playwright-report-${{ matrix.shard }}
          # The traces are the diagnosis for a failure nobody can reproduce locally.
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
